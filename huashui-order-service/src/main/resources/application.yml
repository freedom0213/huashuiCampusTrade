# ============================================================
# 交易服务配置
# 端口 6004（通过网关 6001 对外）
# ============================================================
server:
  port: 6004

spring:
  application:
    name: huashui-order-service

  # 本地敏感配置（数据库账号密码）不提交到仓库。
  # 模板见同目录 application-local.yml.example。
  config:
    import: optional:classpath:application-local.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/huashui_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  rabbitmq:
    # 宿主机端口 5673（容器内 5672），见 docker/docker-compose.yml
    host: 127.0.0.1
    port: 5673
    username: huashui
    password: ${HUASHUI_MQ_PASSWORD:huashui@123}
    virtual-host: /
    # 发送方确认：Broker 收到消息后异步回调告知成功与否
    # correlated 表示回调里能拿到 CorrelationData（我们把 msgId 放在那里，用于定位本地消息记录）
    publisher-confirm-type: correlated
    # 开启「路由失败退回」。必须配合下面的 mandatory=true 才生效：
    # 否则 Broker 会直接丢弃不可路由的消息（交换机和路由键写错时悄无声息）
    publisher-returns: true
    template:
      mandatory: true
    # 本服务只是生产方，不消费消息，因此不需要配置 listener

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:18848
        namespace: public

    openfeign:
      client:
        config:
          default:
            # 默认读超时是 60 秒，太长了：商品服务一旦卡住，
            # 下单请求的线程会被白白挂住 60 秒，并发上来线程池直接耗尽。
            # 宁可快速失败（用户重试一次），也不要慢速失败（拖垮整个服务）
            connect-timeout: 2000
            read-timeout: 3000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      # 注意：t_orders 没有 deleted 列 —— 订单是交易凭证，不允许删除。
      # 以下逻辑删除配置只对「实体中真实存在同名字段」生效，
      # Order 实体没有 deleted 字段，因此不会给它凭空加上条件
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 本服务不配 huashui.jwt：JWT 的签发与校验都在网关完成，
# 下游服务只从请求头读 X-User-Id / X-User-Role，不需要密钥。
# 不配的话 common 的 JwtAutoConfiguration 条件不成立，JwtUtil Bean 不会被创建，
# 也不会因为「密钥没配」而启动失败。

huashui:
  order:
    # 待支付超时分钟数。演示时可以调成 1，便于观察超时自动取消
    pay-timeout-minutes: 30
    # 本地 @Scheduled 兜底任务：阶段 10 接入 XXL-JOB 后关掉，改由调度中心触发
    # （阶段 7 就是按「将来会被 XXL-JOB 取代」设计的，所以这里只是改一个开关，不动代码）
    # ⚠️ 两个开关都是 false 时，不启动调度中心就没人清理超时订单 —— 只想跑单机时改回 true
    timeout-task-enabled: false
    timeout-batch-size: 200
    timeout-task-interval-ms: 60000

    # ========== 本地消息表（消息可靠性）==========
    # 最大补发次数，超过则置为「失败待人工处理」，不再自动重试
    local-message-max-retry: 5
    # 补发任务开关：同上，改由 XXL-JOB 的 localMessageRetryJob 触发
    local-message-task-enabled: false
    local-message-batch-size: 100
    local-message-task-interval-ms: 30000

    # ========== 已锁定但无有效订单的扫描（阶段 10）==========
    # 判定「锁定超时」的额外缓冲：实际阈值 = pay-timeout-minutes + 本值
    # 留缓冲的原因：正常下单到付款之间的锁定是「进行中」而不是「异常」，
    # 卡在同一个时间点上会把正在交易的商品误判为异常
    stale-lock-buffer-minutes: 5
    # 单轮最多处理多少个候选商品，防止一次拉太多把商品服务拖慢
    stale-lock-batch-size: 100

# ========== XXL-JOB 执行器 ==========
xxl:
  job:
    # 调度中心地址。留空则不注册（执行器照常启动，只是任务不会被触发）
    admin:
      addresses: http://127.0.0.1:18080/xxl-job-admin
    # 与调度中心 application.properties 中的 accessToken 一致，用于双向鉴权
    access-token: huashui-job-token-2026
    executor:
      # 执行器名，需要在调度中心的「执行器管理」里对应上（AppName）
      appname: huashui-order-service-executor
      # ⚠️ 显式指定注册地址：调度中心在容器里、执行器在宿主机上，
      #    自动探测会注册成容器到不了的 IP。host.docker.internal 由 Docker Desktop 解析回宿主机
      address: http://host.docker.internal:6005
      ip: ""
      port: 6005
      logpath: ./logs/xxl-job/order
      logretentiondays: 7


knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    cn.freedom.huashui: debug
