# ============================================================
# 华水校园闲置交易平台 —— 本地基础设施
#
# 包含 Redis / RabbitMQ / Nacos / XXL-JOB 调度中心 / Sentinel 控制台。
# MySQL 使用本机已安装的 8.0.34（3306），不容器化。
#
# 【为什么端口不是默认值】
# 本机同时存在 zhixu(tianji-local) 项目，它占用了默认端口：
#   6379 / 5672 / 15672 / 8848 / 9848 / 9849
# 因此这里「容器内端口保持默认，只改宿主机映射」，两套环境可同时运行。
#
# 【为什么绑定 127.0.0.1】
# 不写 IP 时 Docker 会发布到 0.0.0.0，局域网内任何设备都能连上你的
# Redis / RabbitMQ，属于明显的安全缺口。绑定回环地址后只允许本机访问。
#
# 【关于凭据】
# 下面的账号密码是「本地开发专用」，且服务只绑定 127.0.0.1，不对外网暴露。
# 这样写是为了让仓库克隆下来即可直接启动。
# 生产环境应改为通过环境变量 / 密钥管理注入，不要把真实凭据写进配置文件。
#
# 启动：docker compose -f docker/docker-compose.yml up -d
# 停止：docker compose -f docker/docker-compose.yml down
# 查看：docker compose -f docker/docker-compose.yml ps
# ============================================================
name: huashui

services:

  # ---------------- Redis：商品缓存 / 浏览量计数 / 分布式锁 ----------------
  redis:
    image: redis:7.2-alpine
    container_name: huashui-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - huashui@123
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "huashui@123", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------- RabbitMQ：订单取消 → 商品恢复在售 ----------------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: huashui-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5673:5672"     # AMQP 协议端口
      - "127.0.0.1:15673:15672"   # 管理台
    environment:
      RABBITMQ_DEFAULT_USER: huashui
      RABBITMQ_DEFAULT_PASS: huashui@123
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ---------------- Nacos：注册中心 + 配置中心 ----------------
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: huashui-nacos
    restart: unless-stopped
    ports:
      # HTTP 主端口（控制台 + OpenAPI）
      - "127.0.0.1:18848:8848"
      # gRPC 端口：客户端会按「主端口 + 1000」自动推导，
      # 所以宿主机 18848 必须对应 19848，漏映射会报「连不上服务端」且错误信息很含糊
      - "127.0.0.1:19848:9848"
      # 集群通信 gRPC（单机模式下用不到，一并映射以便将来切集群）
      - "127.0.0.1:19849:9849"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---------------- XXL-JOB 调度中心：定时任务的可视化调度与手动触发 ----------------
  #
  # 【为什么容器内连的是 host.docker.internal】
  # 本项目的 MySQL 刻意不容器化（复用本机 8.0.34），而调度中心跑在容器里，
  # 因此要用 host.docker.internal 解析回宿主机。Docker Desktop 内置支持这个名字。
  #
  # 【为什么执行器地址也要配 host.docker.internal】
  # 方向正好相反：调度中心触发任务时是「容器 → 宿主机上的执行器」。
  # 所以两个业务服务里的 xxl.job.executor.address 也写成 host.docker.internal:<port>，
  # 否则调度中心会拿着容器网络里解析不到的 IP 去回调，任务永远触发不成功。
  #
  # 【凭据说明】accessToken 与两个服务 application.yml 中的 xxl.job.access-token 必须一致；
  # 调度中心默认账号 admin / 123456（首次登录后请自行修改）。
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: huashui-xxl-job-admin
    restart: unless-stopped
    ports:
      # 宿主机 18080 → 容器 8080。避开 8080 这个到处都是的端口
      - "127.0.0.1:18080:8080"
    environment:
      # 官方镜像的启动脚本会把 PARAMS 原样追加到 java -jar 之后
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://host.docker.internal:3306/huashui_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        --spring.datasource.username=huashui
        --spring.datasource.password=huashui@123
        --xxl.job.accessToken=huashui-job-token-2026
    volumes:
      - xxl-job-logs:/data/applogs
    # 没有 depends_on：它依赖的 MySQL 是「本机安装、不容器化」的，不在本 compose 里。
    # 万一调度中心比数据库先就绪导致启动失败，restart: unless-stopped 会自动重试
    healthcheck:
      # 镜像里没有 curl/wget/nc，只有 bash —— 所以用 bash 的 /dev/tcp 开一个连接来判断端口可用
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ---------------- Sentinel 控制台：限流规则的可视化配置与实时监控 ----------------
  #
  # 【为什么用 bladex 的镜像】Sentinel 官方没有发布 docker 镜像，这个社区镜像
  # 是最常用的一个（1.8.6 与 spring-cloud-alibaba 2023.0.1.0 内置的客户端版本一致）。
  #
  # 【镜像的端口约定】容器内固定 8858（镜像的 ENTRYPOINT 里写死了
  # -Dserver.port=8858，而且 ENTRYPOINT 不是 shell 形式，塞 JAVA_OPTS 是无效的）。
  # 所以这里只做端口映射，不改它的端口。
  #
  # 【为什么客户端要配「合法 IP 格式」的 client-ip】方向是「容器 → 宿主机」：
  # 控制台要靠客户端心跳上报的 IP 去回调（拉取实时指标、下发规则）。
  # 两个坑（阶段 11 实证）：
  #   ① host.docker.internal 会被控制台以 "invalid ip" 拒绝（它校验 IP 格式），
  #      且失败包在 HTTP 200 里返回、客户端不报错；
  #   ② 网关进程里 Sentinel 的配置快照发生在 SCA 设置属性之前，心跳地址会缓存为空。
  # 最终落地：业务三服务用 application.yml 的
  #   spring.cloud.sentinel.transport.client-ip=${SENTINEL_CLIENT_IP:192.168.65.254}
  # 网关额外用 sentinel.properties 兜底（192.168.65.254 即 Docker Desktop 下
  # host.docker.internal 解析出的宿主机地址，查询方式见该文件注释）。
  #
  # 【默认凭据】sentinel / sentinel（镜像内置，未修改）。端口只绑 127.0.0.1，
  # 不对外网暴露；生产部署时应改成环境变量注入的强口令。
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: huashui-sentinel-dashboard
    restart: unless-stopped
    ports:
      # 宿主机 18858 → 容器 8858。与 Nacos 的 18848 保持同一段，方便记
      - "127.0.0.1:18858:8858"

volumes:
  redis-data:
  rabbitmq-data:
  nacos-data:
  nacos-logs:
  xxl-job-logs: