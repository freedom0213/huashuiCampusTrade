<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>华水闲置 · 移动端实时预览台</title>
    <style>
      /* 开发工具页：只在 `npm run dev` 下访问 http://127.0.0.1:5173/preview.html
         它不参与 `vite build`（构建入口只有 index.html）。 */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        gap: 28px;
        align-items: flex-start;
        justify-content: center;
        padding: 26px 24px 40px;
        background: #16161a;
        color: #e8e8ea;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
      }

      .panel { width: 268px; flex: 0 0 268px; }
      h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
      .sub { margin: 0 0 18px; font-size: 11.5px; color: #8b8b93; line-height: 1.6; }

      .box {
        padding: 13px 14px;
        border-radius: 12px;
        background: #1f1f25;
        border: 1px solid #2c2c34;
        margin-bottom: 12px;
      }
      .box h2 {
        margin: 0 0 10px;
        font-size: 11px;
        font-weight: 600;
        color: #9a9aa3;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        height: 32px;
        padding: 0 10px;
        margin-bottom: 8px;
        border-radius: 8px;
        border: 1px solid #34343d;
        background: #17171c;
        color: #e8e8ea;
        font-size: 12.5px;
      }
      input:focus { outline: none; border-color: #ec6e9c; }

      button {
        height: 32px;
        padding: 0 11px;
        border-radius: 8px;
        border: 1px solid #34343d;
        background: #26262e;
        color: #dcdce0;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover { border-color: #4a4a55; }
      button.primary {
        background: linear-gradient(135deg, #f5a2c2, #e8659a);
        border-color: transparent;
        color: #fff;
        font-weight: 500;
      }
      button:disabled { opacity: 0.45; cursor: not-allowed; }

      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      .row input { flex: 1; min-width: 0; margin-bottom: 0; }

      .routes { display: flex; flex-wrap: wrap; gap: 6px; }
      .routes button { height: 28px; padding: 0 9px; font-size: 11.5px; }
      .routes button.on { border-color: #ec6e9c; color: #f5a2c2; }

      .who { font-size: 12px; color: #b9b9c0; margin-bottom: 9px; }
      .who b { color: #ec6e9c; }
      .tip { margin: 8px 0 0; font-size: 11px; color: #7d7d86; line-height: 1.65; }

      /* 手机框 */
      .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .phone {
        width: 375px;
        height: 812px;
        border-radius: 42px;
        background: #fff;
        box-shadow: 0 0 0 10px #23232a, 0 0 0 11px #3a3a44, 0 26px 60px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        position: relative;
      }
      .phone iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
      .stage .meta { font-size: 11.5px; color: #7d7d86; }

      /* 连接失败时的兜底提示（覆盖在手机屏上）。
         🔴 存在的意义：以前 vite 没启动时手机屏就是**一片空白**，
            看不出是「没启动」还是「页面坏了」。失败必须给出原因与下一步动作。 */
      .fallback {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 24px;
        background: #fff;
      }
      .fallback[hidden] { display: none; }
      .fb-card { text-align: center; }
      .fb-icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff4f8;
        color: #ec6e9c;
      }
      .fb-card h3 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 600;
        color: #1c1c1e;
        letter-spacing: -0.2px;
      }
      .fb-card p {
        margin: 0 0 14px;
        font-size: 12px;
        line-height: 1.7;
        color: #8e8e93;
        text-align: left;
      }
      .fb-cmd {
        padding: 11px 13px;
        border-radius: 10px;
        background: #f6f6f8;
        color: #3a3a3c;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11.5px;
        line-height: 1.8;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .fb-card button { margin-top: 16px; width: 100%; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>移动端实时预览台</h1>
      <p class="sub">
        改代码后 iframe 内的 HMR 会即时生效，无需手动刷新。<br />
        仅供开发使用，<b>不参与构建</b>。
      </p>

      <div class="box">
        <h2>开发服务器</h2>
        <div id="targetOk" style="display: none">
          <p class="who" id="targetWho"></p>
          <div class="row">
            <button id="doOpenReal">在独立标签页打开</button>
          </div>
        </div>
        <div id="targetBad">
          <p class="tip" id="targetTip">正在探测…</p>
          <div class="row">
            <input id="targetInput" placeholder="http://127.0.0.1:5173" />
            <button id="doConnect">连接</button>
          </div>
        </div>
      </div>

      <div class="box">
        <h2>登录态</h2>
        <div id="loginForm">
          <input id="u" placeholder="用户名（如 buyer01）" autocomplete="username" />
          <input id="p" type="password" placeholder="密码" autocomplete="current-password" />
          <div class="row">
            <button class="primary" id="doLogin">登录并刷新</button>
          </div>
          <p class="tip" id="loginTip">带登录态才能预览「我的 / 订单 / 收藏」这些需登录的页面。</p>
        </div>
        <div id="loggedIn" style="display: none">
          <p class="who" id="who"></p>
          <div class="row">
            <button id="doLogout">退出登录</button>
            <button id="doReload">刷新 iframe</button>
          </div>
        </div>
      </div>

      <div class="box">
        <h2>页面</h2>
        <div class="routes" id="routes"></div>
        <p class="tip" id="routeNote">需参数的页面（商品详情 / 卖家主页 / 订单详情）请在下方填 id。</p>
        <div class="row" style="margin-top: 9px">
          <input id="customPath" placeholder="/product/2103... 或 /seller/2103..." />
          <button id="openCustom">打开</button>
        </div>
      </div>

      <div class="box">
        <h2>尺寸</h2>
        <div class="routes" id="sizes"></div>
      </div>
    </div>

    <div class="stage">
      <div class="phone" id="phone">
        <iframe id="f" src="about:blank"></iframe>
        <div class="fallback" id="fallback" hidden>
          <div class="fb-card">
            <div class="fb-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3.6v8.2M12 16.4h.02" />
                <circle cx="12" cy="12" r="8.8" />
              </svg>
            </div>
            <h3 id="fbTitle">预览台没连上开发服务器</h3>
            <p id="fbDesc"></p>
            <div class="fb-cmd" id="fbCmd"></div>
            <button class="primary" id="fbRetry">重新连接</button>
          </div>
        </div>
      </div>
      <p class="meta" id="meta">375 × 812</p>
    </div>

    <script type="module">
      const TOKEN_KEY = 'huashui_token'
      const USER_KEY = 'huashui_user'

      const f = document.getElementById('f')
      const phone = document.getElementById('phone')
      const meta = document.getElementById('meta')

      const ROUTES = [
        { path: '/', label: '首页' },
        { path: '/search', label: '搜索' },
        { path: '/publish', label: '发布', auth: true },
        { path: '/mine', label: '我的', auth: true },
        { path: '/user/products', label: '我的发布', auth: true },
        { path: '/user/orders', label: '我的订单', auth: true },
        { path: '/user/favorites', label: '收藏', auth: true },
        { path: '/user/profile', label: '个人资料', auth: true },
        { path: '/notices', label: '通知中心', auth: true },
        { path: '/login', label: '登录' },
        { path: '/register', label: '注册' }
      ]

      const SIZES = [
        { w: 375, h: 812, label: '375×812' },
        { w: 390, h: 844, label: '390×844' },
        { w: 414, h: 896, label: '414×896' },
        { w: 480, h: 900, label: '480×900' }
      ]

      let current = '/'

      /* ══════════ 开发服务器地址探测 ══════════
         🔴 为什么必须探测，而不是直接用相对路径：
            本页可能**不是**由 Vite 提供的。实测踩到过——把 preview.html 交给 WorkBuddy
            预览面板后，它由内置静态服务（形如 `http://127.0.0.1:59343/static-html/xxx/preview.html`）
            打开，此时所有相对路径都指向那个静态服务：`/index.html` 返回 404、iframe 里的 `/`
            也拿不到应用 → 手机屏报「没连上开发服务器」，而实际上 Vite 一直好好的。
         做法：不假设「自己就在 Vite 上」，按候选顺序探测，找到哪个可用就用哪个，
              并把结果记进 localStorage，下次优先复用。 */
      const TARGET_KEY = 'huashui_preview_target'

      function probeTargets() {
        const list = []
        const add = (o) => {
          o = String(o || '').trim().replace(/\/+$/, '').replace(/\/preview\.html$/i, '')
          if (o && !list.includes(o)) list.push(o)
        }
        // ① URL 显式指定（优先级最高，便于手动纠正）
        add(new URLSearchParams(location.search).get('target'))
        // ② 上次探测成功的地址
        add(localStorage.getItem(TARGET_KEY))
        // ③ 当前 origin —— 直接从 Vite 打开时就是它，零额外延迟
        if (location.protocol.startsWith('http')) add(location.origin)
        // ④ 项目约定端口（vite.config.js server.port = 5173，被占用时 Vite 会顺延）
        for (const p of [5173, 5174, 5175]) {
          add(`http://127.0.0.1:${p}`)
          add(`http://localhost:${p}`)
        }
        return list
      }

      /** 探测某地址上是不是 Vite 开发服务器。
          🔴 判据必须严格，踩过坑：最初写成「有响应就算可达」，结果把 WorkBuddy 的静态服务、
             甚至 python -m http.server 都误判成了 Vite（它们对 /@vite/client 返回 404
             但连接是通的）→ 手机屏报「应用没渲染出来」，而真正的 Vite 就在旁边好好的。
          正确判据（两级都过才算）：
            ① 状态码 200 —— 明确响应了 404 说明那不是 Vite，直接排除，不再退让；
            ② 响应体里含 `vite` 字样 —— 防别的服务器恰好也返回 200。
          连接被拒 / CORS 拦截时返回 false（无法确证，交给下一个候选）。 */
      async function reachable(origin) {
        try {
          const r = await fetch(origin + '/@vite/client', { cache: 'no-store' })
          if (!r.ok) return false
          const text = await r.text()
          return /vite/i.test(text)
        } catch {
          return false
        }
      }

      let TARGET = ''
      /** 本页是否由别的服务器托管（即 TARGET ≠ 当前 origin）——决定登录是否可用 */
      let hostedElsewhere = false

      const setTargetTip = (t) => (document.getElementById('targetTip').textContent = t)

      function updateTargetUI() {
        const okEl = document.getElementById('targetOk')
        const badEl = document.getElementById('targetBad')
        if (TARGET) {
          okEl.style.display = 'block'
          badEl.style.display = 'none'
          document.getElementById('targetWho').innerHTML = hostedElsewhere
            ? `已连到 <b>${TARGET}</b><br /><span style="color:#8e8e93">本页由 ${location.origin} 提供，`
              + `与开发服务器不同源</span>`
            : `已连到 <b>${TARGET}</b>（本页同源）`
        } else {
          okEl.style.display = 'none'
          badEl.style.display = 'block'
          document.getElementById('targetInput').value = 'http://127.0.0.1:5173'
          setTargetTip('没探测到开发服务器。可手动填地址后点「连接」。')
        }
        /* 跨源时登录请求会被浏览器 CORS 拦掉（Vite 的 proxy 响应不带 CORS 头），
           所以直接禁用并说清原因 —— 比让用户点了「没反应」要好 */
        document.getElementById('doLogin').disabled = hostedElsewhere
        document.getElementById('loginTip').textContent = hostedElsewhere
          ? '⚠️ 本页与开发服务器不同源，登录请求会被浏览器拦截。请先点上方「在独立标签页打开」。'
          : '带登录态才能预览「我的 / 订单 / 收藏」这些需登录的页面。'
      }

      /* ══════════ 失败诊断：手机屏内不再是一片空白 ══════════
         空白是最坏的失败模式 —— 看不出是「服务没启动」还是「页面写坏了」。
         所以把每种真实原因分别识别出来，并给出下一步动作。 */
      const fallbackEl = document.getElementById('fallback')
      const fbTitle = document.getElementById('fbTitle')
      const fbDesc = document.getElementById('fbDesc')
      const fbCmd = document.getElementById('fbCmd')
      let frameTimer = null

      function showFallback(title, desc, cmd) {
        clearTimeout(frameTimer)
        fbTitle.textContent = title
        fbDesc.textContent = desc
        fbCmd.textContent = cmd || ''
        fbCmd.style.display = cmd ? 'block' : 'none'
        fallbackEl.hidden = false
      }

      function hideFallback() {
        fallbackEl.hidden = true
      }

      /** 加载页面到手机屏，并挂一个兜底检查：
          8 秒后 iframe 里仍然没有挂载出内容，就说明前端应用没起来
          （跨源时读不到 contentDocument，try/catch 直接跳过这项检查） */
      function loadFrame(path) {
        if (!TARGET) return
        hideFallback()
        clearTimeout(frameTimer)
        f.src = TARGET + path
        frameTimer = setTimeout(() => {
          try {
            const app = f.contentDocument?.getElementById('app')
            if (app && !app.children.length) {
              showFallback(
                '前端应用没有渲染出来',
                '开发服务器响应正常，但页面没能挂载。请在浏览器控制台（F12）查看报错，常见原因是依赖缺失或代码编译错误。',
                ''
              )
            }
          } catch {
            /* 跨源，跳过 */
          }
        }, 8000)
      }

      /** 启动自检：先在手机屏上给出结论，再决定是否加载页面 */
      async function boot() {
        // ① 用 file:// 直接双击打开的本地文件
        if (location.protocol === 'file:') {
          updateTargetUI()
          return showFallback(
            '这个页面不能直接双击打开',
            '你现在是用 file:// 协议打开本地文件：页内脚本会被浏览器的同源策略拦掉，手机屏里必然是空的。请通过开发服务器访问：',
            'http://127.0.0.1:5173/preview.html'
          )
        }

        // ② 逐个候选地址探测
        const candidates = probeTargets()
        setTargetTip('正在探测开发服务器…')
        TARGET = ''
        for (const origin of candidates) {
          if (await reachable(origin)) {
            TARGET = origin
            break
          }
        }
        hostedElsewhere = !!TARGET && TARGET !== location.origin
        if (TARGET) localStorage.setItem(TARGET_KEY, TARGET)
        updateTargetUI()

        if (!TARGET) {
          return showFallback(
            '没找到开发服务器',
            '已尝试下面这些地址，都没有响应。请在 huashui-web 目录启动 Vite 后点「重新连接」：',
            'cd huashui-web\nnpm run dev\n\n已尝试：\n' + candidates.join('\n')
          )
        }

        // ③ 探测通过：加载页面并高亮对应路由按钮
        open(current)
      }

      document.getElementById('fbRetry').onclick = () => boot()

      document.getElementById('doConnect').onclick = async () => {
        const origin = document.getElementById('targetInput').value
        const clean = String(origin || '').trim().replace(/\/+$/, '').replace(/\/preview\.html$/i, '')
        if (!clean) return
        setTargetTip('正在探测 ' + clean + ' …')
        if (await reachable(clean)) {
          TARGET = clean
          hostedElsewhere = TARGET !== location.origin
          localStorage.setItem(TARGET_KEY, TARGET)
          updateTargetUI()
          open(current)
        } else {
          setTargetTip('⚠️ ' + clean + ' 没有响应，请确认 Vite 已启动、端口是否正确。')
        }
      }
      document.getElementById('targetInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('doConnect').click()
      })

      document.getElementById('doOpenReal').onclick = () => {
        window.open(TARGET + '/preview.html', '_blank')
      }

      /* ── 路由按钮 ── */
      const routesEl = document.getElementById('routes')
      ROUTES.forEach((r) => {
        const b = document.createElement('button')
        b.textContent = r.label
        b.onclick = () => open(r.path)
        b.dataset.path = r.path
        routesEl.appendChild(b)
      })

      /* ── 尺寸按钮 ── */
      const sizesEl = document.getElementById('sizes')
      SIZES.forEach((s, i) => {
        const b = document.createElement('button')
        b.textContent = s.label
        if (i === 0) b.classList.add('on')
        b.onclick = () => {
          phone.style.width = s.w + 'px'
          phone.style.height = s.h + 'px'
          meta.textContent = s.w + ' × ' + s.h
          ;[...sizesEl.children].forEach((x) => x.classList.remove('on'))
          b.classList.add('on')
        }
        sizesEl.appendChild(b)
      })

      function open(path) {
        current = path
        loadFrame(path)
        ;[...routesEl.children].forEach((b) =>
          b.classList.toggle('on', b.dataset.path === path)
        )
      }

      document.getElementById('openCustom').onclick = () => {
        const v = document.getElementById('customPath').value.trim()
        if (v) open(v.startsWith('/') ? v : '/' + v)
      }
      document.getElementById('customPath').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('openCustom').click()
      })
      document.getElementById('doReload').onclick = () => {
        if (!TARGET) return
        // 直接清 iframe 再重载（不能走 loadFrame，否则会拼成 TARGET + 'about:blank'）
        clearTimeout(frameTimer)
        f.src = 'about:blank'
        setTimeout(() => loadFrame(current), 30)
      }

      /* ── 登录态：token 与本页同源共享，所以直接写 localStorage ── */
      function readUser() {
        try {
          return JSON.parse(localStorage.getItem(USER_KEY) || 'null')
        } catch {
          return null
        }
      }
      function refreshAuthUI() {
        const token = localStorage.getItem(TOKEN_KEY)
        const user = readUser()
        document.getElementById('loginForm').style.display = token ? 'none' : 'block'
        document.getElementById('loggedIn').style.display = token ? 'block' : 'none'
        if (token) {
          document.getElementById('who').innerHTML =
            '已登录：<b>' + (user?.nickname || user?.username || '未知用户') + '</b>'
        }
      }

      document.getElementById('doLogin').onclick = async () => {
        const btn = document.getElementById('doLogin')
        const username = document.getElementById('u').value.trim()
        const password = document.getElementById('p').value
        if (!username || !password) return alert('请填写用户名与密码')
        btn.disabled = true
        btn.textContent = '登录中…'
        try {
          // 用探测到的 TARGET 而不是相对路径：本页可能不是由 Vite 提供的
          const res = await fetch(TARGET + '/api/user/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          })
          const body = await res.json()
          if (body.code !== 200) throw new Error(body.message || '登录失败（HTTP ' + res.status + '）')
          localStorage.setItem(TOKEN_KEY, body.data.token)
          localStorage.setItem(USER_KEY, JSON.stringify(body.data))
          refreshAuthUI()
          document.getElementById('doReload').click()
        } catch (e) {
          alert(e.message)
        } finally {
          btn.disabled = false
          btn.textContent = '登录并刷新'
        }
      }

      document.getElementById('doLogout').onclick = () => {
        localStorage.removeItem(TOKEN_KEY)
        localStorage.removeItem(USER_KEY)
        refreshAuthUI()
        document.getElementById('doReload').click()
      }

      refreshAuthUI()
      boot()
    </script>
  </body>
</html>
