<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>华水闲置 · 移动端实时预览台</title>
    <style>
      /* 开发工具页：只在 `npm run dev` 下访问 http://127.0.0.1:5173/preview.html
         它不参与 `vite build`（构建入口只有 index.html）。 */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        gap: 28px;
        align-items: flex-start;
        justify-content: center;
        padding: 26px 24px 40px;
        background: #16161a;
        color: #e8e8ea;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
      }

      .panel { width: 268px; flex: 0 0 268px; }
      h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
      .sub { margin: 0 0 18px; font-size: 11.5px; color: #8b8b93; line-height: 1.6; }

      .box {
        padding: 13px 14px;
        border-radius: 12px;
        background: #1f1f25;
        border: 1px solid #2c2c34;
        margin-bottom: 12px;
      }
      .box h2 {
        margin: 0 0 10px;
        font-size: 11px;
        font-weight: 600;
        color: #9a9aa3;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        height: 32px;
        padding: 0 10px;
        margin-bottom: 8px;
        border-radius: 8px;
        border: 1px solid #34343d;
        background: #17171c;
        color: #e8e8ea;
        font-size: 12.5px;
      }
      input:focus { outline: none; border-color: #ec6e9c; }

      button {
        height: 32px;
        padding: 0 11px;
        border-radius: 8px;
        border: 1px solid #34343d;
        background: #26262e;
        color: #dcdce0;
        font-size: 12px;
        cursor: pointer;
      }
      button:hover { border-color: #4a4a55; }
      button.primary {
        background: linear-gradient(135deg, #f5a2c2, #e8659a);
        border-color: transparent;
        color: #fff;
        font-weight: 500;
      }
      button:disabled { opacity: 0.45; cursor: not-allowed; }

      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      .row input { flex: 1; min-width: 0; margin-bottom: 0; }

      .routes { display: flex; flex-wrap: wrap; gap: 6px; }
      .routes button { height: 28px; padding: 0 9px; font-size: 11.5px; }
      .routes button.on { border-color: #ec6e9c; color: #f5a2c2; }

      .who { font-size: 12px; color: #b9b9c0; margin-bottom: 9px; }
      .who b { color: #ec6e9c; }
      .tip { margin: 8px 0 0; font-size: 11px; color: #7d7d86; line-height: 1.65; }

      /* 手机框 */
      .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .phone {
        width: 375px;
        height: 812px;
        border-radius: 42px;
        background: #fff;
        box-shadow: 0 0 0 10px #23232a, 0 0 0 11px #3a3a44, 0 26px 60px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        position: relative;
      }
      .phone iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
      .stage .meta { font-size: 11.5px; color: #7d7d86; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>移动端实时预览台</h1>
      <p class="sub">
        改代码后 iframe 内的 HMR 会即时生效，无需手动刷新。<br />
        仅供开发使用，<b>不参与构建</b>。
      </p>

      <div class="box">
        <h2>登录态</h2>
        <div id="loginForm">
          <input id="u" placeholder="用户名（如 buyer01）" autocomplete="username" />
          <input id="p" type="password" placeholder="密码" autocomplete="current-password" />
          <div class="row">
            <button class="primary" id="doLogin">登录并刷新</button>
          </div>
          <p class="tip">带登录态才能预览「我的 / 订单 / 收藏」这些需登录的页面。</p>
        </div>
        <div id="loggedIn" style="display: none">
          <p class="who" id="who"></p>
          <div class="row">
            <button id="doLogout">退出登录</button>
            <button id="doReload">刷新 iframe</button>
          </div>
        </div>
      </div>

      <div class="box">
        <h2>页面</h2>
        <div class="routes" id="routes"></div>
        <p class="tip" id="routeNote">需参数的页面（商品详情 / 卖家主页 / 订单详情）请在下方填 id。</p>
        <div class="row" style="margin-top: 9px">
          <input id="customPath" placeholder="/product/2103... 或 /seller/2103..." />
          <button id="openCustom">打开</button>
        </div>
      </div>

      <div class="box">
        <h2>尺寸</h2>
        <div class="routes" id="sizes"></div>
      </div>
    </div>

    <div class="stage">
      <div class="phone" id="phone">
        <iframe id="f" src="/"></iframe>
      </div>
      <p class="meta" id="meta">375 × 812</p>
    </div>

    <script type="module">
      const TOKEN_KEY = 'huashui_token'
      const USER_KEY = 'huashui_user'

      const f = document.getElementById('f')
      const phone = document.getElementById('phone')
      const meta = document.getElementById('meta')

      const ROUTES = [
        { path: '/', label: '首页' },
        { path: '/search', label: '搜索' },
        { path: '/publish', label: '发布', auth: true },
        { path: '/mine', label: '我的', auth: true },
        { path: '/user/products', label: '我的发布', auth: true },
        { path: '/user/orders', label: '我的订单', auth: true },
        { path: '/user/favorites', label: '收藏', auth: true },
        { path: '/user/profile', label: '个人资料', auth: true },
        { path: '/notices', label: '通知中心', auth: true },
        { path: '/login', label: '登录' },
        { path: '/register', label: '注册' }
      ]

      const SIZES = [
        { w: 375, h: 812, label: '375×812' },
        { w: 390, h: 844, label: '390×844' },
        { w: 414, h: 896, label: '414×896' },
        { w: 480, h: 900, label: '480×900' }
      ]

      let current = '/'

      /* ── 路由按钮 ── */
      const routesEl = document.getElementById('routes')
      ROUTES.forEach((r) => {
        const b = document.createElement('button')
        b.textContent = r.label
        b.onclick = () => open(r.path)
        b.dataset.path = r.path
        routesEl.appendChild(b)
      })

      /* ── 尺寸按钮 ── */
      const sizesEl = document.getElementById('sizes')
      SIZES.forEach((s, i) => {
        const b = document.createElement('button')
        b.textContent = s.label
        if (i === 0) b.classList.add('on')
        b.onclick = () => {
          phone.style.width = s.w + 'px'
          phone.style.height = s.h + 'px'
          meta.textContent = s.w + ' × ' + s.h
          ;[...sizesEl.children].forEach((x) => x.classList.remove('on'))
          b.classList.add('on')
        }
        sizesEl.appendChild(b)
      })

      function open(path) {
        current = path
        f.src = path
        ;[...routesEl.children].forEach((b) =>
          b.classList.toggle('on', b.dataset.path === path)
        )
      }

      document.getElementById('openCustom').onclick = () => {
        const v = document.getElementById('customPath').value.trim()
        if (v) open(v.startsWith('/') ? v : '/' + v)
      }
      document.getElementById('customPath').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('openCustom').click()
      })
      document.getElementById('doReload').onclick = () => {
        f.src = 'about:blank'
        setTimeout(() => (f.src = current), 30)
      }

      /* ── 登录态：token 与本页同源共享，所以直接写 localStorage ── */
      function readUser() {
        try {
          return JSON.parse(localStorage.getItem(USER_KEY) || 'null')
        } catch {
          return null
        }
      }
      function refreshAuthUI() {
        const token = localStorage.getItem(TOKEN_KEY)
        const user = readUser()
        document.getElementById('loginForm').style.display = token ? 'none' : 'block'
        document.getElementById('loggedIn').style.display = token ? 'block' : 'none'
        if (token) {
          document.getElementById('who').innerHTML =
            '已登录：<b>' + (user?.nickname || user?.username || '未知用户') + '</b>'
        }
      }

      document.getElementById('doLogin').onclick = async () => {
        const btn = document.getElementById('doLogin')
        const username = document.getElementById('u').value.trim()
        const password = document.getElementById('p').value
        if (!username || !password) return alert('请填写用户名与密码')
        btn.disabled = true
        btn.textContent = '登录中…'
        try {
          const res = await fetch('/api/user/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          })
          const body = await res.json()
          if (body.code !== 200) throw new Error(body.message || '登录失败（HTTP ' + res.status + '）')
          localStorage.setItem(TOKEN_KEY, body.data.token)
          localStorage.setItem(USER_KEY, JSON.stringify(body.data))
          refreshAuthUI()
          document.getElementById('doReload').click()
        } catch (e) {
          alert(e.message)
        } finally {
          btn.disabled = false
          btn.textContent = '登录并刷新'
        }
      }

      document.getElementById('doLogout').onclick = () => {
        localStorage.removeItem(TOKEN_KEY)
        localStorage.removeItem(USER_KEY)
        refreshAuthUI()
        document.getElementById('doReload').click()
      }

      refreshAuthUI()
      open('/')
    </script>
  </body>
</html>
