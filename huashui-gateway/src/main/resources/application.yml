# ============================================================
# 网关配置
# 端口 6001（避开本机其他项目常用的 80xx 段）
# ============================================================
server:
  port: 6001

spring:
  application:
    name: huashui-gateway

  cloud:
    nacos:
      discovery:
        # Nacos 宿主机端口是 18848（容器内 8848）
        # 客户端会自动按「端口 + 1000」连接 gRPC 的 19848，compose 里已一并映射
        server-addr: 127.0.0.1:18848
        namespace: public

    # ---------------- Sentinel 限流（阶段 11）----------------
    # 网关是「限流最该待的地方」：所有外部流量都从这里过，
    # 规则只配一处就能拦住打向任何服务的流量，不用每个服务各写一套。
    sentinel:
      transport:
        # 控制台：容器内 8858，宿主机映射 18858（见 docker/docker-compose.yml）
        dashboard: 127.0.0.1:18858
        # 🔴 控制台在容器里、本服务在宿主机上，方向是「容器 → 宿主机」。
        # 心跳上报的 IP 有两个硬性要求：
        #   ① 必须是合法 IP 格式 —— host.docker.internal 会被控制台以
        #      "invalid ip" 拒绝，且失败包在 HTTP 200 里返回、客户端不报错，
        #      表现为「服务在控制台里永远不出现」这种静默失效；
        #   ② 控制台容器能通过它反连本服务的 transport 端口（拉指标/推规则）。
        # 默认值是 Docker Desktop 下 host.docker.internal 解析出的宿主机地址；
        # 不同环境可能不同，查询自己的值：
        #   docker exec huashui-sentinel-dashboard getent hosts host.docker.internal
        client-ip: ${SENTINEL_CLIENT_IP:192.168.65.254}
        # 各服务显式分配端口。同机跑 4 个服务时都抢默认 8719，
        # Sentinel 会静默 +1 递增，「谁占了哪个端口」变得随机，排查时对不上号
        port: 8719
      # 启动即注册到控制台。默认是懒加载：控制台要等该服务的第一个请求才看得到它，
      # 演示时容易误判成「没接上」
      eager: true

    gateway:
      discovery:
        locator:
          # 关闭「按服务名自动生成路由」，路由一律在下面显式声明。
          # 自动路由会把所有服务及其内部接口一并暴露出去，不可控。
          enabled: false
          lower-case-service-id: true

      # 全局跨域配置 —— 整个平台只在这里配一次，各服务一律不配
      # 使用 JWT 放在请求头里传递，不依赖 Cookie，因此 allow-credentials 可以关掉，
      # 从而允许使用 "*" 通配来源（规范禁止 "*" 与 credentials 同时出现）
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            exposed-headers: "*"
            allow-credentials: false
            max-age: 3600

      routes:
        # StripPrefix=1 会去掉路径中的 /api，下游服务里接口直接映射成 /user/**、/product/**
        - id: user-service
          uri: lb://huashui-user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1

        - id: product-service
          uri: lb://huashui-product-service
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1

        # 收藏。它归属商品域（本质是「用户与商品之间的关系」，不跨服务就能查），
        # 但对外作为独立资源暴露：挂在 /api/product/** 下会让「我的收藏」
        # 看起来像商品的子资源，语义不干净。三个收藏接口都需登录，不在白名单内
        - id: favorite-service
          uri: lb://huashui-product-service
          predicates:
            - Path=/api/favorite/**
          filters:
            - StripPrefix=1

        - id: order-service
          uri: lb://huashui-order-service
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1

        # 分类是独立资源，单独走一条路由。
        # 若挂在 /api/product/category/** 下，将来管理端的「新增分类」就变成了
        # 「往商品资源里塞子资源」，语义上说不通。
        - id: category-service
          uri: lb://huashui-product-service
          predicates:
            - Path=/api/category/**
          filters:
            - StripPrefix=1

        # 文件上传（目前由 product-service 提供）
        - id: file-service
          uri: lb://huashui-product-service
          predicates:
            - Path=/api/file/**
          filters:
            - StripPrefix=1

        # 上传的图片：直接透传，不做 StripPrefix，
        # 因为 product-service 的静态资源映射就是挂在 /uploads/** 上
        - id: uploads
          uri: lb://huashui-product-service
          predicates:
            - Path=/uploads/**

# ============================================================
# 业务配置
# ============================================================
huashui:
  jwt:
    # 本地开发默认密钥（长度必须 ≥ 32 字节，HS256 的硬性要求）
    # 生产环境必须通过环境变量 HUASHUI_JWT_SECRET 覆盖，不要使用这里的默认值
    secret: ${HUASHUI_JWT_SECRET:huashui-campus-trade-dev-jwt-secret-2026}
    ttl-minutes: 120

  gateway:
    # 免登录白名单，支持 Ant 风格通配符
    # 改为配置项而不是写死在代码里：新增免登录接口时不用改代码、不用重新打包
    white-list:
      - /api/user/login
      - /api/user/register
      # 卖家主页对游客开放（只返回昵称/头像/院系，不含手机号）
      # 注意：/api/user/{id}/contact 不在白名单内，手机号必须登录后才能取
      - /api/user/detail/**
      - /api/product/list
      - /api/product/detail/**
      # 分类列表对游客开放（首页胶囊行 / 搜索筛选 / 发布页下拉都要用）
      - /api/category/**
      # 卖家主页的「历史成交笔数」，与 /api/user/detail/** 一起支撑游客浏览卖家主页
      # 注意：/api/order 下的其余接口都不在白名单内，订单数据必须登录才能看
      - /api/order/sold-count/**
      # 商品图片对游客开放，否则未登录用户在列表页看不到图
      # 注意：/api/file/upload 不在白名单内，上传必须登录
      - /uploads/**

logging:
  level:
    cn.freedom.huashui: debug
