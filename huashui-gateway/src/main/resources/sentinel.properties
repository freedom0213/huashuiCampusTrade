# ============================================================
# Sentinel 客户端配置（仅网关需要，业务服务不需要）
#
# 【为什么网关要用这个文件】
# Sentinel 的 SentinelConfig 在类第一次加载时把配置「快照」进静态 Properties，
# 之后 System.setProperty 再设置 csp.sentinel.* 都读不到。
# 业务服务（Servlet）下 SCA 设置属性的时机早于快照，一切正常；
# 网关（WebFlux + SCG 适配器）实测快照发生在 SCA 设置属性之前 ——
# 结果是心跳发送器构造时拿到的控制台地址为空，此后每次心跳都静默跳过
# （表现：控制台里永远看不到网关，且客户端无任何报错）。
# 这个文件由 Sentinel 在快照时读取，不受时序影响，是官方支持的配置途径。
#
# 【与 application.yml 的关系】两者配置同一个东西，必须保持一致。
# 文件里不能使用 ${ENV} 占位符，环境不同时改这里。
# ============================================================

# 控制台地址（容器内 8858，宿主机映射 18858）
csp.sentinel.dashboard.server=127.0.0.1:18858

# 心跳上报的 IP：必须是合法 IP 且控制台容器可反连（host.docker.internal 会被
# 控制台以 "invalid ip" 拒绝）。默认值是 Docker Desktop 下 host.docker.internal
# 解析出的宿主机地址，查询方式：
#   docker exec huashui-sentinel-dashboard getent hosts host.docker.internal
csp.sentinel.heartbeat.client.ip=192.168.65.254

# transport 端口（与 application.yml 的 spring.cloud.sentinel.transport.port 一致）
csp.sentinel.api.port=8719

# 应用名（心跳注册与 metrics 日志文件名）
project.name=huashui-gateway
