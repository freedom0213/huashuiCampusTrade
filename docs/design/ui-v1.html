<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华水校园闲置交易平台 · 前端设计稿 V1.1</title>
<style>
:root{
  /* —— 主色：淡一档的玫瑰粉 —— */
  --pink:#EC6E9C;
  --pink-lt:#F5A2C2;
  --pink-dp:#DB5A8A;
  --pink-bg:#FDEDF4;
  /* —— 白→粉 渐变 —— */
  --grad-btn:linear-gradient(135deg,#F5A2C2 0%,#E8659A 100%);
  --grad-page:linear-gradient(180deg,#FFFFFF 0%,#FFFAFC 48%,#FFF2F8 100%);
  --grad-mine:linear-gradient(180deg,#FCE7F0 0%,#FFFAFC 100%);
  --grad-avatar:linear-gradient(140deg,#F7B3CB,#EC6E9C);
  /* —— 中性色 —— */
  --text:#1C1C1E;
  --text-2:#8E8E93;
  --text-3:#B8B8BD;
  --line:#F2F2F5;
  --field:#F6F6F8;
  --red:#FF3B30;
  --sh-card:0 2px 10px rgba(28,28,30,.05);
  --sh-bar:0 -1px 0 rgba(28,28,30,.045), 0 -8px 24px rgba(28,28,30,.035);
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-pop:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  background:#E8E8ED;color:var(--text);-webkit-font-smoothing:antialiased;
  padding:52px 0 80px;
}
svg{display:block}

/* ================= 画板 ================= */
.board-head{max-width:2100px;margin:0 auto 40px;padding:0 40px}
.board-head h1{font-size:24px;font-weight:600;letter-spacing:-.3px}
.board-head h1 em{font-style:normal;color:var(--pink)}
.board-head p{margin-top:9px;font-size:13px;color:#6C6C70;line-height:1.75}
.board-head code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  background:#DEDEE4;padding:2px 6px;border-radius:5px;color:#48484A}
.board-head b{color:var(--pink-dp)}
.board{display:flex;gap:56px;padding:0 40px 24px;overflow-x:auto;align-items:flex-start}
.board-item{flex:0 0 auto;display:flex;flex-direction:column;gap:15px}
.cap{display:flex;align-items:baseline;gap:9px;padding-left:6px;flex-wrap:wrap;max-width:375px}
.cap b{font-size:14px;font-weight:600}
.cap i{font-style:normal;font-size:12px;color:#7C7C80;font-family:ui-monospace,Menlo,monospace}
.cap span{font-size:12px;color:#8E8E93;line-height:1.5}

.phone{width:375px;height:812px;border-radius:44px;position:relative;background:#fff;
  box-shadow:0 0 0 11px #1C1C1E, 0 0 0 12px #3A3A3C, 0 26px 60px rgba(28,28,30,.22)}
.screen{position:absolute;inset:0;border-radius:44px;overflow:hidden;background:var(--grad-page)}

.view{position:absolute;inset:0;display:flex;flex-direction:column;background:transparent}
.view-home{z-index:1}
.view-detail{z-index:5;opacity:0;pointer-events:none}
.view-detail.open{opacity:1;pointer-events:auto}
/* 详情页走绝对定位实现沉浸式大图：图片顶到屏顶，状态栏与返回键浮在图上 */
.view-detail .sb{position:absolute;top:0;left:0;right:0}
.view-detail .scroll{position:absolute;top:0;left:0;right:0;bottom:84px}
.view-detail .actionbar{position:absolute;left:0;right:0;bottom:0;height:84px}

/* ================= 状态栏 ================= */
.sb{height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;
    padding:0 26px 0 32px;font-size:14px;font-weight:600;letter-spacing:.2px;position:relative;z-index:20}
.sb .rig{display:flex;align-items:center;gap:6px}

/* ================= 全局按压反馈 ================= */
button,.chip,.tab,.mitem,.seg span,.card,.nbtn,.stats div{
  transition:transform .3s var(--ease-pop);
}
button:active,.chip:active,.tab:active,.mitem:active,.seg span:active,.nbtn:active,.stats div:active{
  transform:scale(.92);
}
.card:active{transform:scale(.975)}
@keyframes pop{0%{transform:scale(.88)}62%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.scroll{flex:1;overflow:hidden;position:relative}
.pad{padding:0 16px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 12px}
.sec-head h2{font-size:15px;font-weight:600;letter-spacing:-.2px}
.sec-head a{font-size:12.5px;color:var(--text-2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ================= 商品卡（图片为主 · 文字退后） ================= */
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:var(--sh-card);cursor:pointer;
      animation:rise .55s var(--ease) backwards}
.thumb{aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center;
       font-size:50px;overflow:hidden}
.thumb .em{opacity:.82}
.t1{background:linear-gradient(150deg,#FFF3F7,#FBE2EC)}
.t2{background:linear-gradient(150deg,#F5F7FC,#E7ECF5)}
.t3{background:linear-gradient(150deg,#F1F9F4,#E0F1E8)}
.t4{background:linear-gradient(150deg,#FDF8F2,#F3EADE)}
.card .info{padding:9px 10px 12px}
.card h3{font-size:12.5px;font-weight:500;line-height:1.34;color:#6E6E73;letter-spacing:-.05px;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow{display:flex;align-items:baseline;gap:5px;margin-top:6px}
.price{font-size:15px;font-weight:600;color:var(--pink);letter-spacing:-.2px}
.origin{font-size:10.5px;color:#C7C7CC;text-decoration:line-through}
.cond{margin-left:auto;font-size:10px;color:#B8B8BD}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}
.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}

/* ================= 底栏 ================= */
.tabbar{flex:0 0 83px;display:flex;align-items:flex-start;padding-top:9px;position:relative;z-index:9;
        background:rgba(255,255,255,.78);backdrop-filter:blur(24px) saturate(180%);
        -webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--sh-bar)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;
     color:var(--text-2);cursor:pointer}
.tab.on{color:var(--pink)}
.tab.mid{gap:2px;margin-top:-2px}
.tab.mid .bubble{width:38px;height:38px;border-radius:50%;background:var(--grad-btn);color:#fff;
       display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(236,110,156,.34)}
.tab.mid span{color:var(--pink);font-weight:500}

/* ================= 首页 ================= */
.home-top{display:flex;align-items:center;justify-content:space-between;padding:2px 16px 0}
.campus{display:flex;align-items:center;gap:4px;font-size:16.5px;font-weight:600;letter-spacing:-.3px}
.campus svg{color:var(--pink)}
.bell{position:relative;width:34px;height:34px;border-radius:50%;background:var(--field);
      display:flex;align-items:center;justify-content:center;color:#3A3A3C;border:none;cursor:pointer}
.bell i{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;
        background:var(--pink);box-shadow:0 0 0 1.5px #fff}
.search{display:flex;align-items:center;gap:8px;height:40px;margin:14px 16px 0;padding:0 13px;
        border-radius:12px;background:var(--field);color:var(--text-3);font-size:13.5px;cursor:pointer}
.cats{display:flex;gap:8px;padding:14px 16px 2px;overflow:hidden}
.chip{flex:0 0 auto;height:30px;padding:0 14px;border-radius:999px;background:var(--field);
      color:#3A3A3C;font-size:12.5px;display:flex;align-items:center;cursor:pointer}
.chip.on{background:var(--grad-btn);color:#fff;font-weight:500;box-shadow:0 3px 12px rgba(236,110,156,.3);
         animation:pop .4s var(--ease)}

/* ================= 详情页 ================= */
.gallery{flex:0 0 375px;margin-bottom:6px;position:relative;display:flex;align-items:center;
         justify-content:center;font-size:118px;overflow:hidden;
         background:linear-gradient(150deg,#F5F7FC,#E4EAF4);transform-origin:0 0;will-change:transform}
.gallery .em{opacity:.86}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(28,28,30,.18);transition:all .3s var(--ease)}
.dots i.on{background:var(--pink);width:18px;border-radius:3px}
.navfloat{position:absolute;top:50px;left:0;right:0;height:52px;z-index:15;display:flex;
          align-items:center;padding:0 16px}
.nbtn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      color:#1C1C1E;border:none;box-shadow:0 1px 6px rgba(28,28,30,.1);cursor:pointer}
.detail{padding:14px 16px 0}
.prow-big{display:flex;align-items:baseline;gap:7px}
.price-big{font-size:27px;font-weight:600;color:var(--pink);letter-spacing:-.7px}
.price-big small{font-size:16px;font-weight:600;margin-right:1px}
.origin-big{font-size:12.5px;color:#C7C7CC;text-decoration:line-through}
.pmeta{margin-left:auto;font-size:11.5px;color:var(--text-3);align-self:flex-end;padding-bottom:4px}
.dtitle{font-size:16.5px;font-weight:600;line-height:1.42;margin-top:10px;letter-spacing:-.2px}
.metaline{font-size:12.5px;color:var(--text-2);margin-top:8px}
/* 地点卡：白底细边，不再用粉底抢焦点 */
.placecard{display:flex;gap:11px;align-items:center;margin-top:16px;padding:13px 14px;
           border-radius:14px;background:#fff;border:1px solid var(--line);
           box-shadow:0 1px 5px rgba(28,28,30,.035)}
.pin{width:32px;height:32px;flex:0 0 32px;border-radius:50%;background:var(--pink-bg);color:var(--pink);
     display:flex;align-items:center;justify-content:center}
.placecard b{font-size:14px;font-weight:600;display:block}
.placecard span{font-size:11.5px;color:var(--text-2);margin-top:3px;display:block}
.desc{margin-top:20px;font-size:13.5px;line-height:1.75;color:#48484A;white-space:pre-wrap}
.seller{display:flex;align-items:center;gap:11px;margin-top:22px;padding-top:18px;
        border-top:1px solid var(--line)}
.av{width:42px;height:42px;border-radius:50%;background:var(--grad-avatar);
    color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 42px}
.seller .nm{flex:1}
.seller b{font-size:14.5px;font-weight:600;display:block}
.seller span{font-size:11.5px;color:var(--text-2);margin-top:3px;display:block}
.chev{color:#D1D1D6}
.actionbar{flex:0 0 84px;display:flex;align-items:center;gap:11px;padding:0 16px 34px;
           background:rgba(255,255,255,.84);backdrop-filter:blur(24px) saturate(180%);
           -webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--sh-bar);position:relative;z-index:9}
.fav{width:84px;height:48px;border-radius:14px;background:var(--field);border:none;cursor:pointer;
     display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
     font-size:10px;color:#3A3A3C}
.btn-main{flex:1;height:48px;border-radius:14px;border:none;background:var(--grad-btn);color:#fff;
          font-size:15.5px;font-weight:600;letter-spacing:.3px;cursor:pointer;
          box-shadow:0 6px 18px rgba(236,110,156,.3)}

/* ================= 发布页 ================= */
.pubnav{flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.pubnav button{background:none;border:none;font-size:14.5px;color:var(--text-2);padding:8px;cursor:pointer}
.pubnav b{font-size:15.5px;font-weight:600}
.uploader{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:6px 16px 0}
.box{aspect-ratio:1/1;border-radius:12px;background:#fff;border:1px solid var(--line);
     display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-3);gap:2px;
     box-shadow:0 1px 4px rgba(28,28,30,.03)}
.box.add{border:1.2px dashed #E6C8D6;background:#FFFBFC;color:var(--pink);cursor:pointer}
.box.add span{font-size:11px;color:var(--text-3)}
.hint{font-size:11.5px;color:var(--text-2);padding:9px 16px 0}
.form{margin:20px 16px 0;background:#fff;border-radius:14px;padding:0 14px;box-shadow:var(--sh-card)}
.field{display:flex;align-items:center;min-height:52px;border-bottom:1px solid var(--line);gap:12px}
.field:last-child{border-bottom:none}
.field label{flex:0 0 54px;font-size:13.5px;color:#3A3A3C}
.field label.sub{flex:0 0 auto;font-size:12.5px;color:var(--text-2);margin-left:4px}
.field input,.field textarea{flex:1;border:none;outline:none;font-size:13.5px;font-family:inherit;
     color:var(--text);background:none;resize:none}
.field input::placeholder,.field textarea::placeholder{color:var(--text-3)}
.field .mini{flex:0 0 78px;font-size:15px;font-weight:600;color:var(--pink)}
.field .mini::placeholder{font-size:12.5px;font-weight:400;color:var(--text-3)}
.field .val{margin-left:auto;font-size:13.5px;color:#3A3A3C;display:flex;align-items:center;gap:2px;cursor:pointer}
.field.col{display:block;padding:13px 0}
.field.col label{display:block;margin-bottom:9px}
.seg{display:flex;gap:6px}
.seg span{flex:1;height:34px;border-radius:9px;background:var(--field);font-size:11.5px;cursor:pointer;
          display:flex;align-items:center;justify-content:center;color:#5A5A5E}
.seg span.on{background:var(--grad-btn);color:#fff;font-weight:500;box-shadow:0 3px 12px rgba(236,110,156,.26)}
.pubfoot{flex:0 0 106px;padding:14px 16px 34px;background:rgba(255,255,255,.84);
     backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--sh-bar);position:relative;z-index:9}
.btn-wide{width:100%;height:48px;border-radius:14px;border:none;background:var(--grad-btn);color:#fff;
     font-size:15.5px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(236,110,156,.3)}
.pubfoot p{text-align:center;font-size:11px;color:var(--text-2);margin-top:9px}

/* ================= 我的 ================= */
.minehead{padding:18px 16px 20px;background:var(--grad-mine)}
.mrow{display:flex;align-items:center;gap:13px;margin-top:6px}
.av.big{width:56px;height:56px;font-size:21px;flex:0 0 56px;box-shadow:0 4px 16px rgba(236,110,156,.24)}
.mrow b{font-size:18px;font-weight:600;display:block;letter-spacing:-.2px}
.mrow span{font-size:12px;color:#9A7A88;margin-top:4px;display:block}
.stats{display:flex;margin-top:18px;background:#fff;border-radius:14px;padding:15px 0;box-shadow:var(--sh-card)}
.stats div{flex:1;text-align:center;position:relative;cursor:pointer}
.stats div+div::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:var(--line)}
.stats b{font-size:19px;font-weight:600;color:var(--pink);letter-spacing:-.3px}
.stats span{display:block;font-size:11.5px;color:var(--text-2);margin-top:4px}
.mlist{margin:16px 16px 0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--sh-card)}
.mitem{display:flex;align-items:center;gap:13px;height:54px;padding:0 16px;position:relative;cursor:pointer}
.mitem+.mitem::before{content:"";position:absolute;top:0;left:54px;right:0;height:1px;background:var(--line)}
.mico{width:29px;height:29px;border-radius:9px;background:var(--pink-bg);color:var(--pink-dp);
      display:flex;align-items:center;justify-content:center;flex:0 0 29px}
.mitem b{flex:1;font-size:14.5px;font-weight:400}
.mdot{width:8px;height:8px;border-radius:50%;background:var(--pink)}
.mlist.second{margin-top:12px}
.mitem.danger b{color:var(--red)}

/* ============================================================
   以下为 V1.2 新增页面样式
   ============================================================ */

/* —— 二级页导航 —— */
.subnav{flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;
        padding:0 8px 0 4px;position:relative}
.subnav .ttl{font-size:16px;font-weight:600;position:absolute;left:50%;transform:translateX(-50%)}
.subnav .act{font-size:13.5px;color:var(--pink-dp);padding:8px 12px;background:none;border:none;cursor:pointer}
.iconbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
         background:none;border:none;color:#1C1C1E;cursor:pointer}

/* —— 搜索 / 列表页 —— */
.searchbar{display:flex;align-items:center;gap:8px;height:38px;margin:2px 16px 0;padding:0 12px;
           border-radius:11px;background:var(--field);font-size:13.5px;color:var(--text)}
.searchbar .clr{width:17px;height:17px;border-radius:50%;background:#C7C7CC;color:#fff;
                display:flex;align-items:center;justify-content:center;flex:0 0 17px}
.sorts{display:flex;gap:17px;padding:15px 16px 0;font-size:13px;color:var(--text-2);align-items:center}
.sorts .s{cursor:pointer;display:flex;align-items:center;gap:3px}
.sorts .s.on{color:var(--pink);font-weight:600}
.sorts .fil{margin-left:auto;display:flex;align-items:center;gap:4px;color:#3A3A3C;cursor:pointer}
.filters{display:flex;gap:8px;padding:13px 16px 0;overflow:hidden}
.fchip{flex:0 0 auto;height:27px;padding:0 10px;border-radius:8px;background:var(--field);
       font-size:11.5px;color:#5A5A5E;display:flex;align-items:center;gap:3px;cursor:pointer}
.fchip.on{background:var(--pink-bg);color:var(--pink-dp);font-weight:500}
.resultbar{padding:15px 16px 0;font-size:11.5px;color:var(--text-2)}

/* —— 卖家主页 —— */
.sellerhead{padding:4px 16px 20px;background:var(--grad-mine)}
.sellerrow{display:flex;align-items:center;gap:13px;margin-top:16px}
.sellerrow b{font-size:17px;font-weight:600;display:block;letter-spacing:-.2px}
.sellerrow span{font-size:11.5px;color:#9A7A88;margin-top:4px;display:block}
.pillrow{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.pill{padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.78);font-size:11.5px;
      color:#8A5A70;display:flex;align-items:center;gap:4px}

/* —— 收藏页 —— */
.favbtn{position:absolute;right:7px;top:7px;width:26px;height:26px;border-radius:50%;
        background:rgba(255,255,255,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
        display:flex;align-items:center;justify-content:center;color:var(--pink);cursor:pointer}
.dead{position:absolute;inset:0;background:rgba(255,255,255,.62);display:flex;align-items:center;justify-content:center}
.dead em{font-style:normal;font-size:11.5px;color:#7C7C80;background:rgba(255,255,255,.95);
         padding:4px 11px;border-radius:999px}

/* —— 通知中心 —— */
.nlist{margin:8px 16px 0}
.nitem{display:flex;gap:11px;padding:14px;background:#fff;border-radius:14px;margin-bottom:9px;box-shadow:var(--sh-card)}
.nico{width:30px;height:30px;border-radius:9px;flex:0 0 30px;display:flex;align-items:center;justify-content:center}
.nitem .txt{flex:1;min-width:0}
.nitem b{font-size:13.5px;font-weight:600;display:block}
.nitem p{font-size:12px;color:#6E6E73;line-height:1.55;margin-top:4px}
.nitem time{font-size:10.5px;color:var(--text-3);margin-top:6px;display:block}
.ndot{width:7px;height:7px;border-radius:50%;background:var(--pink);flex:0 0 7px;margin-top:5px}

/* —— 登录 / 注册 —— */
.authwrap{flex:1;padding:0 26px}
.brand{display:flex;flex-direction:column;align-items:center;padding:58px 0 32px}
.logo{width:66px;height:66px;border-radius:20px;background:var(--grad-btn);color:#fff;
      display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;letter-spacing:1px;
      box-shadow:0 10px 26px rgba(236,110,156,.32)}
.brand h1{font-size:20px;font-weight:600;margin-top:16px;letter-spacing:-.3px}
.brand p{font-size:12px;color:var(--text-2);margin-top:7px}
.ainp{height:50px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ainp input{flex:1;border:none;outline:none;font-size:14.5px;font-family:inherit;background:none}
.ainp input::placeholder{color:var(--text-3)}
.ainp .unit{font-size:13px;color:var(--text-2)}
.agree{font-size:11px;color:var(--text-2);line-height:1.65;margin-top:20px}
.agree em{font-style:normal;color:var(--pink-dp)}
.switchrow{text-align:center;font-size:13px;color:var(--text-2);margin-top:24px}
.switchrow b{color:var(--pink-dp);font-weight:500}

<script>
/* ==========================================================
   分段截图辅助：#from=N 时只保留第 N 屏起的 4 屏，
   用于在无头浏览器里分段输出（transform 平移会被裁掉，不可用）
   ========================================================== */
(function(){
  var m = (location.search + location.hash).match(/from=(\d+)/);
  if(!m) return;
  var from = +m[1], count = 4;
  Array.prototype.forEach.call(document.querySelectorAll('.board-item'), function(it, i){
    if(i < from - 1 || i >= from - 1 + count) it.style.display = 'none';
  });
})();

/* ==========================================================
   FLIP 共享元素转场：卡片 ⇄ 详情页
   卡片缩略图的位置/尺寸 → 详情大图的位置/尺寸，双向可逆
   ========================================================== */
(function(){
  var EASE_IN  = 'cubic-bezier(.22,1,.36,1)';
  var EASE_OUT = 'cubic-bezier(.4,0,.6,1)';
  var DUR_OPEN = 460, DUR_CLOSE = 420;

  function setup(phone, initial){
    var vHome   = phone.querySelector('.view-home');
    var vDetail = phone.querySelector('.view-detail');
    if(!vHome || !vDetail) return;

    var gallery = vDetail.querySelector('.gallery');
    var fades   = vDetail.querySelectorAll('[data-fade]');
    var backBtn = vDetail.querySelector('[data-back]');
    var cards   = vHome.querySelectorAll('.card');
    if(!gallery || !cards.length) return;

    var lastCard = null, busy = false;

    function rectIn(el){
      var p = phone.getBoundingClientRect(), r = el.getBoundingClientRect();
      return { x:r.left-p.left, y:r.top-p.top, w:r.width, h:r.height };
    }

    function open(card){
      if(busy) return;
      var thumb = card.querySelector('.thumb');
      if(!thumb) return;
      busy = true; lastCard = card;

      var from = rectIn(thumb);

      vDetail.classList.add('open');
      vHome.style.transition = 'opacity .18s ease';
      vHome.style.opacity = '0';

      var to = rectIn(gallery);
      var s  = from.w / to.w;

      gallery.style.transition = 'none';
      gallery.style.transform  = 'translate(' + (from.x-to.x) + 'px,' + (from.y-to.y) + 'px) scale(' + s + ')';
      gallery.style.borderRadius = '15px';

      fades.forEach(function(el){
        el.style.transition = 'none';
        el.style.opacity = '0';
        el.style.transform = 'translateY(8px)';
      });

      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        gallery.style.transition = 'transform ' + DUR_OPEN + 'ms ' + EASE_IN + ', border-radius ' + DUR_OPEN + 'ms ease';
        gallery.style.transform  = 'translate(0,0) scale(1)';
        gallery.style.borderRadius = '0px';

        fades.forEach(function(el, i){
          var d = 110 + i * 42;
          el.style.transition = 'opacity .34s ease ' + d + 'ms, transform .34s ease ' + d + 'ms';
          el.style.opacity = '1';
          el.style.transform = 'none';
        });

        setTimeout(function(){ busy = false; }, DUR_OPEN + 40);
      }); });
    }

    function close(){
      if(busy || !lastCard) return;
      busy = true;

      var from = rectIn(gallery);
      var to   = rectIn(lastCard.querySelector('.thumb'));
      var s    = to.w / from.w;
      var dx   = to.x - from.x;
      var dy   = to.y - from.y;

      fades.forEach(function(el, i){
        el.style.transition = 'opacity .16s ease ' + (i*8) + 'ms, transform .16s ease';
        el.style.opacity = '0';
        el.style.transform = 'translateY(5px)';
      });

      gallery.style.transition = 'transform ' + DUR_CLOSE + 'ms ' + EASE_OUT + ', border-radius ' + DUR_CLOSE + 'ms ease';
      gallery.style.transform  = 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')';
      gallery.style.borderRadius = '15px';

      setTimeout(function(){
        vDetail.classList.remove('open');
        gallery.style.transition = 'none';
        gallery.style.transform = 'none';
        gallery.style.borderRadius = '0px';
        vHome.style.transition = 'opacity .22s ease';
        vHome.style.opacity = '1';
        busy = false;
      }, DUR_CLOSE);
    }

    Array.prototype.forEach.call(cards, function(c){
      c.addEventListener('click', function(){ open(c); });
    });
    if(backBtn) backBtn.addEventListener('click', close);

    /* 初始停在详情态：直接铺好，不播动画 */
    if(initial === 'detail'){
      lastCard = cards[0];
      vDetail.classList.add('open');
      vHome.style.opacity = '0';
      fades.forEach(function(el){ el.style.opacity = '1'; el.style.transform = 'none'; });
    }
  }

  var p1 = document.querySelector('[data-phone]');
  if(p1) setup(p1, 'detail');
})();

/* ==========================================================
   组件级交互：分类胶囊、成色分段器、底栏 tab
   ========================================================== */
(function(){
  document.addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if(chip && chip.parentNode){
      Array.prototype.forEach.call(chip.parentNode.children, function(c){ c.classList.remove('on'); });
      chip.classList.add('on');
      return;
    }
    var seg = e.target.closest('.seg span');
    if(seg && seg.parentNode){
      Array.prototype.forEach.call(seg.parentNode.children, function(c){ c.classList.remove('on'); });
      seg.classList.add('on');
      return;
    }
    var tab = e.target.closest('.tab');
    if(tab && tab.parentNode){
      Array.prototype.forEach.call(tab.parentNode.children, function(c){ c.classList.remove('on'); });
      tab.classList.add('on');
    }
  });
})();
</script>
