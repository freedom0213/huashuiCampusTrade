# ============================================================
# 用户服务配置
# 端口 6002（通过网关 6001 对外）
# ============================================================
server:
  port: 6002

spring:
  application:
    name: huashui-user-service

  # 本地敏感配置（数据库账号密码）不提交到仓库。
  # 模板见同目录 application-local.yml.example，复制后填自己的密码。
  config:
    import: optional:classpath:application-local.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding=utf8 让驱动用 UTF-8 与服务端通信，
    # 否则中文 Windows 下会按 GBK 处理，写进去就是乱码
    url: jdbc:mysql://127.0.0.1:3306/huashui_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  cloud:
    nacos:
      discovery:
        # Nacos 宿主机端口 18848，客户端自动按 +1000 连 gRPC 19848
        server-addr: 127.0.0.1:18848
        namespace: public

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期把 SQL 打到控制台，方便核对语句与参数；上线记得去掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

huashui:
  jwt:
    # 必须与网关使用同一个密钥，否则网关无法校验本服务签发的令牌
    secret: ${HUASHUI_JWT_SECRET:huashui-campus-trade-dev-jwt-secret-2026}
    ttl-minutes: 120

# ============================================================
# 接口文档：http://127.0.0.1:6002/doc.html
# ============================================================
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    cn.freedom.huashui: debug
